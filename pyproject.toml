[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "authorize_google.py",
    "authorize_google_local.py",
    "refresh.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Start conservative: pyflakes (F) + import sorting (I). Widen over time.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
